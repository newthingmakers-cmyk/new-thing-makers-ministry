<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173c35">
<title>New Thing Makers Ministry</title>
<style>
:root{--green:#173c35;--green2:#24584d;--gold:#d7b66d;--paper:#fbfaf6;--ink:#202a27;--muted:#66736e;--line:#e4e6df}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Noto Serif Myanmar","Myanmar Text",serif;line-height:1.75}
button,input{font:inherit}.hero{background:linear-gradient(135deg,var(--green),#102c27);color:#fff;padding:30px 18px 34px;text-align:center;border-bottom:4px solid var(--gold)}
.brand{font-family:Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;font-size:clamp(1.1rem,3vw,1.7rem);font-weight:700}
.tagline{margin:8px auto 0;max-width:700px;color:#e8eee9}.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px}
.lang-button,.plain-button{border:1px solid #cbd5cf;border-radius:999px;padding:7px 15px;background:#fff;color:var(--green);cursor:pointer}.lang-button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 56px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:18px}
.search{width:100%;padding:11px 14px;border:1px solid #cbd5cf;border-radius:10px;background:#fff}.section-label{font-family:Arial,sans-serif;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green2);font-weight:700;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,34px);box-shadow:0 8px 26px #20372d0a}.date{font-family:Arial,sans-serif;color:var(--muted);font-size:.9rem;margin:0 0 6px}
h1{font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.35;color:var(--green);margin:0 0 18px}h2{font-size:1.1rem;color:var(--green2);margin:24px 0 5px}
.verse{padding:15px 18px;background:#f5f3eb;border-left:4px solid var(--gold);border-radius:0 10px 10px 0;white-space:pre-wrap}.body-copy{white-space:pre-wrap;overflow-wrap:anywhere}
.truth,.decision{padding:12px 15px;border-radius:10px;background:#edf3ef}.archive{margin-top:30px}details.year{border:1px solid var(--line);border-radius:12px;background:#fff;margin:9px 0;overflow:hidden}
details.year>summary{cursor:pointer;padding:12px 16px;background:#f1f4f0;color:var(--green);font-weight:bold}.month{padding:8px 14px 12px}.month h3{font-size:1rem;margin:8px 0;color:var(--muted)}
.entry{display:block;text-align:left;width:100%;padding:9px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:var(--green);line-height:1.5}.entry:hover,.entry:focus{background:#f1f4f0}.entry small{display:block;color:var(--muted);font-family:Arial,sans-serif;font-size:.78rem}
.status{padding:16px;text-align:center;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:.9rem;margin-top:30px}.error{color:#8b2f24;background:#fff1ef;border-radius:10px;padding:12px}
@media(max-width:600px){.toolbar{grid-template-columns:1fr}.topbar{position:static}.wrap{padding-top:18px}.card{border-radius:12px}}
</style>
</head>
<body>
<header class="hero"><div class="brand">New Thing Makers Ministry</div><p class="tagline" id="tagline">Daily devotionals to help us walk with God.</p></header>
<nav class="topbar" aria-label="Language selection"><button class="lang-button" id="englishBtn" aria-pressed="true">English</button><button class="lang-button" id="myanmarBtn" aria-pressed="false">မြန်မာ</button><button class="plain-button" id="latestBtn">Latest devotional</button></nav>
<main class="wrap">
<div class="toolbar"><input class="search" id="searchInput" type="search" placeholder="Search devotionals…" aria-label="Search devotionals"><button class="plain-button" id="archiveToggle">Archive</button></div>
<div id="status" class="status" role="status">Loading devotionals…</div><article id="devotional" class="card" hidden></article>
<section class="archive" id="archive" hidden><p class="section-label" id="archiveHeading">Devotional archive</p><div id="archiveList"></div></section>
<p class="footer" id="footerText">New Thing Makers Ministry</p>
</main>
<script>
(() => {
"use strict";
const REPO="newthingmakers-cmyk/new-thing-makers-ministry", BRANCH="main";
const API=`https://api.github.com/repos/${REPO}/contents/devotionals?ref=${BRANCH}`;
const MONTHS={en:["January","February","March","April","May","June","July","August","September","October","November","December"],my:["ဇန်နဝါရီ","ဖေဖော်ဝါရီ","မတ်","ဧပြီ","မေ","ဇွန်","ဇူလိုင်","ဩဂုတ်","စက်တင်ဘာ","အောက်တိုဘာ","နိုဝင်ဘာ","ဒီဇင်ဘာ"]};
const TEXT={
en:{tagline:"Daily devotionals to help us walk with God.",latest:"Latest devotional",search:"Search devotionals…",archive:"Archive",archiveHeading:"Devotional archive",verse:"Bible verse",reflection:"Reflection",truth:"Truth to remember",application:"Application",decision:"My decision",prayer:"Prayer",loading:"Loading devotionals…",empty:"No devotionals found.",failed:"Could not load the devotionals. Please check your internet connection and try again.",footer:"New Thing Makers Ministry"},
my:{tagline:"ဘုရားသခင်နှင့်အတူ လျှောက်လှမ်းနိုင်ရန် နေ့စဉ်ဝိညာဉ်ရေးရာ ဝေငှချက်များ။",latest:"နောက်ဆုံးဝေငှချက်",search:"ဝေငှချက်များကို ရှာဖွေရန်…",archive:"မှတ်တမ်း",archiveHeading:"ဝေငှချက်မှတ်တမ်း",verse:"ကျမ်းချက်",reflection:"ဆင်ခြင်အောက်မေ့ရန်",truth:"မှတ်သားရမည့် သမ္မာတရား",application:"လက်တွေ့အသုံးချရန်",decision:"ကျွန်ုပ်၏ဆုံးဖြတ်ချက်",prayer:"ဆုတောင်းခြင်း",loading:"ဝေငှချက်များကို ဖွင့်နေပါသည်…",empty:"ဝေငှချက် မတွေ့ပါ။",failed:"ဝေငှချက်များကို ဖွင့်မရပါ။ အင်တာနက်ကို စစ်ဆေးပြီး ထပ်ကြိုးစားပါ။",footer:"New Thing Makers Ministry"}
};
let language="en", devotionals=[];
const $=id=>document.getElementById(id), myanmarRegex=/[\u1000-\u109F\uAA60-\uAA7F]/;
function splitLegacy(value){if(!value)return{en:"",my:""};const m=myanmarRegex.exec(value);if(!m)return{en:value.trim(),my:""};return{en:value.slice(0,m.index).replace(/[\s|—–-]+$/,"").trim(),my:value.slice(m.index).trim()};}
function parseFrontMatter(text){
 const normalized=text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n"), match=normalized.match(/^---\s*\n([\s\S]*?)\n---(?:\s*\n|$)/);
 if(!match)return{};const lines=match[1].split("\n"),data={};let block=null;
 for(const line of lines){const f=line.match(/^([A-Za-z0-9_-]+):(?:\s*(.*))?$/);
  if(f){const key=f[1],raw=f[2]||"";if(["|",">","|-",">-"].includes(raw)){block={key,fold:raw.startsWith(">"),lines:[]};data[key]="";}
   else{block=null;data[key]=raw.replace(/^(['"])([\s\S]*)\1$/,"$2").trim();}}
  else if(block&&/^\s+/.test(line)){block.lines.push(line.replace(/^\s{2,}/,""));data[block.key]=block.lines.join(block.fold?" ":"\n").trim();}
  else if(block&&line.trim()===""){block.lines.push("");data[block.key]=block.lines.join(block.fold?" ":"\n").trim();}
 }return data;
}
function normalizeDate(raw,filename){const candidate=raw||(filename.match(/(\d{4}-\d{2}-\d{2})/)||[])[1]||"",d=new Date(candidate);return Number.isNaN(d.getTime())?"":d.toISOString().slice(0,10);}
function normalize(data,filename,url,rawText){
 const old={title:splitLegacy(data.title||""),verse:splitLegacy(data.verse||data.scripture||""),reflection:splitLegacy(data.reflection||""),application:splitLegacy(data.application||""),prayer:splitLegacy(data.prayer||"")};
 const f=(key,oldKey,lang)=>String(data[key]||((oldKey&&old[oldKey])?old[oldKey][lang]:"")||"").trim();
 return {filename,url,date:normalizeDate(data.date,filename),day:String(data.day||"").trim(),
 title_en:f("title_en","title","en"),title_my:f("title_my","title","my"),
 verse_en:f("verse_en","verse","en"),verse_my:f("verse_my","verse","my"),scripture_en:f("scripture_en",null,"en"),scripture_my:f("scripture_my",null,"my"),
 reflection_en:f("reflection_en","reflection","en"),reflection_my:f("reflection_my","reflection","my"),
 truth_en:f("truth_en",null,"en"),truth_my:f("truth_my",null,"my"),
 application_en:f("application_en","application","en"),application_my:f("application_my","application","my"),
 decision_en:f("decision_en",null,"en"),decision_my:f("decision_my",null,"my"),
 prayer_en:f("prayer_en","prayer","en"),prayer_my:f("prayer_my","prayer","my"),rawText};
}
function dateLabel(date){if(!date)return"";const d=new Date(date+"T12:00:00");return language==="my"?`${d.getFullYear()} ${MONTHS.my[d.getMonth()]} ${d.getDate()}`:d.toLocaleDateString("en",{year:"numeric",month:"long",day:"numeric"});}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function localized(d,stem){return language==="my"?(d[stem+"_my"]||d[stem+"_en"]||""):(d[stem+"_en"]||d[stem+"_my"]||"");}
function block(label,content,klass="body-copy"){return content?`<section><h2>${esc(label)}</h2><div class="${klass}">${esc(content)}</div></section>`:"";}
function hashFile(){const m=location.hash.match(/(?:^#|&)devotional=([^&]+)/);if(!m)return"";try{return decodeURIComponent(m[1]);}catch{return m[1];}}
function show(d,updateHash=true){if(!d)return;const title=localized(d,"title")||(language==="my"?"နေ့စဉ်ဝိညာဉ်ရေးရာ ဝေငှချက်":"Daily Devotional"),verse=localized(d,"verse")||localized(d,"scripture");
 $("devotional").innerHTML=`<p class="date">${esc(dateLabel(d.date))}${d.day?" · "+esc(language==="my"?"နေ့ "+d.day:"Day "+d.day):""}</p><h1>${esc(title)}</h1>${block(TEXT[language].verse,verse,"verse")}${block(TEXT[language].reflection,localized(d,"reflection"))}${block(TEXT[language].truth,localized(d,"truth"),"truth")}${block(TEXT[language].application,localized(d,"application"))}${block(TEXT[language].decision,localized(d,"decision"),"decision")}${block(TEXT[language].prayer,localized(d,"prayer"))}`;
 $("devotional").hidden=false;$("status").hidden=true;if(updateHash&&d.filename)history.replaceState(null,"",`#devotional=${encodeURIComponent(d.filename)}`);
}
function matches(d,q){return !q||[d.title_en,d.title_my,d.verse_en,d.verse_my,d.reflection_en,d.reflection_my,d.application_en,d.application_my,d.prayer_en,d.prayer_my,d.filename,d.rawText].join(" ").toLowerCase().includes(q.toLowerCase());}
function renderArchive(){
 const filtered=devotionals.filter(d=>matches(d,$("searchInput").value.trim()));
 if(!filtered.length){$("archiveList").innerHTML=`<p class="status">${esc(TEXT[language].empty)}</p>`;return;}
 const groups=new Map();filtered.forEach(d=>{const y=d.date?d.date.slice(0,4):(language==="my"?"အခြား":"Other"),mi=d.date?Number(d.date.slice(5,7))-1:-1,m=mi>=0?MONTHS[language][mi]:(language==="my"?"ရက်စွဲမသိ":"Undated");if(!groups.has(y))groups.set(y,new Map());if(!groups.get(y).has(m))groups.get(y).set(m,[]);groups.get(y).get(m).push(d);});
 $("archiveList").innerHTML=[...groups.entries()].map(([y,months,],i)=>`<details class="year" ${i===0?"open":""}><summary>${esc(y)}</summary>${[...months.entries()].map(([m,items])=>`<div class="month"><h3>${esc(m)}</h3>${items.map(d=>`<button class="entry" data-file="${esc(d.filename)}">${esc(localized(d,"title")||d.filename)}<small>${esc(dateLabel(d.date))}</small></button>`).join("")}</div>`).join("")}</details>`).join("");
 $("archiveList").querySelectorAll("[data-file]").forEach(b=>b.addEventListener("click",()=>{show(devotionals.find(d=>d.filename===b.dataset.file));window.scrollTo({top:0,behavior:"smooth"});}));
}
function applyLanguage(){
 document.documentElement.lang=language==="my"?"my":"en";$("tagline").textContent=TEXT[language].tagline;$("latestBtn").textContent=TEXT[language].latest;$("searchInput").placeholder=TEXT[language].search;$("searchInput").setAttribute("aria-label",TEXT[language].search);$("archiveToggle").textContent=TEXT[language].archive;$("archiveHeading").textContent=TEXT[language].archiveHeading;$("footerText").textContent=TEXT[language].footer;
 $("englishBtn").setAttribute("aria-pressed",String(language==="en"));$("myanmarBtn").setAttribute("aria-pressed",String(language==="my"));const active=devotionals.find(d=>d.filename===hashFile())||devotionals[0];if(active)show(active,false);renderArchive();
}
async function load(){
 try{const r=await fetch(API,{headers:{"Accept":"application/vnd.github+json"}});if(!r.ok)throw Error("GitHub API "+r.status);const files=await r.json(),md=files.filter(f=>f.type==="file"&&f.name.toLowerCase().endsWith(".md"));
 const results=await Promise.all(md.map(async file=>{try{const r=await fetch(file.download_url);if(!r.ok)return null;const text=await r.text();return normalize(parseFrontMatter(text),file.name,file.download_url,text);}catch{return null;}}));
 devotionals=results.filter(d=>d&&d.date).sort((a,b)=>b.date.localeCompare(a.date)||a.filename.localeCompare(b.filename));$("status").hidden=true;
 if(!devotionals.length){$("status").hidden=false;$("status").textContent=TEXT[language].empty;return;}show(devotionals.find(d=>d.filename===hashFile())||devotionals[0],false);renderArchive();
 }catch(e){console.error(e);$("status").hidden=false;$("status").innerHTML=`<p class="error">${esc(TEXT[language].failed)}</p>`;}
}
$("englishBtn").addEventListener("click",()=>{language="en";applyLanguage();});$("myanmarBtn").addEventListener("click",()=>{language="my";applyLanguage();});
$("latestBtn").addEventListener("click",()=>{if(devotionals[0]){show(devotionals[0]);window.scrollTo({top:0,behavior:"smooth"});}});
$("archiveToggle").addEventListener("click",()=>{$("archive").hidden=!$("archive").hidden;if(!$("archive").hidden)$("archive").scrollIntoView({behavior:"smooth",block:"start"});});
$("searchInput").addEventListener("input",()=>{$("archive").hidden=false;renderArchive();});
window.addEventListener("hashchange",()=>{const d=devotionals.find(x=>x.filename===hashFile());if(d)show(d,false);});
load();
})();
</script>
</body>
</html>
