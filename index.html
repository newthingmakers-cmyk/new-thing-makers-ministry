<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173c35">
<meta name="description" content="New Thing Makers Ministry — Growing in Christ, Making Disciples, Expanding His Kingdom.">
<title>New Thing Makers Ministry</title>
<style>
:root{--green:#12345a;--green2:#1d4e89;--gold:#d7b66d;--paper:#ffffff;--ink:#1f2937;--muted:#667085;--line:#e5e7eb;--white:#fff;--soft:#eff4f8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:78px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Noto Serif Myanmar","Myanmar Text",serif;line-height:1.75}
button,input{font:inherit}
a{color:inherit}
button{cursor:pointer}
.site-hero{position:relative;isolation:isolate;overflow:hidden;text-align:center;color:#fff;background:linear-gradient(180deg,rgba(15,43,37,.5),rgba(15,43,37,.9)),url("sunrise.jpg") center 48%/cover no-repeat;min-height:360px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 18px 58px;border-bottom:4px solid var(--gold)}
.site-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(23,60,53,.35),rgba(16,44,39,.28));z-index:-1}
.brand{font-family:Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(1.25rem,3.6vw,2.2rem);font-weight:700;line-height:1.35;text-wrap:balance}
.brand-my{font-size:clamp(1.15rem,3vw,1.7rem);margin:10px 0 0}
.hero-line{font-size:clamp(1.15rem,2.7vw,1.7rem);font-weight:bold;margin:22px 0 0}
.hero-subline{margin:5px auto 0;max-width:760px;color:#f1f3ec}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;text-decoration:none;border:1px solid transparent;font-weight:bold;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:#20352e}
.btn-light{background:#fff;color:var(--green)}
.btn-outline{border-color:#cbd5cf;color:var(--green);background:#fff}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:9px 12px}
.nav-links{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.nav-links a{display:inline-block;text-decoration:none;color:var(--green);padding:7px 12px;border-radius:999px;font-family:Arial,sans-serif;font-size:.92rem;font-weight:700}
.nav-links a:hover,.nav-links a:focus{background:var(--soft)}
.lang-button,.plain-button{border:1px solid #cbd5cf;border-radius:999px;padding:7px 13px;background:#fff;color:var(--green);cursor:pointer}
.lang-button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:48px 18px}
.section{scroll-margin-top:82px}
.section-heading{text-align:center;margin:0 auto 24px;max-width:780px}
.eyebrow{font-family:Arial,sans-serif;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green2);font-weight:700;margin:0 0 8px}
h1,h2,h3{line-height:1.35}
h1{font-size:clamp(1.7rem,4vw,2.5rem);color:var(--green);margin:0 0 14px}
h2{font-size:clamp(1.35rem,3vw,1.8rem);color:var(--green);margin:0 0 12px}
h3{color:var(--green2);margin:0 0 8px}
.lead{font-size:1.08rem;max-width:780px;margin:0 auto;color:#45534d}
.about-intro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,40px);text-align:center;box-shadow:0 8px 26px #20372d08}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.info-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 26px #20372d08}
.info-card .symbol{font-size:1.6rem;margin-bottom:8px}
.info-card p{margin:0;color:#4e5c55}
.teaching-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:26px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px)}
.teaching-image{display:block;width:100%;height:290px;object-fit:cover;border-radius:12px;background:#e8eee9}
.teaching-copy p{margin-top:0}
.contact-panel{background:linear-gradient(135deg,var(--green),#102c27);color:#fff;text-align:center;border-radius:18px;padding:clamp(25px,5vw,48px)}
.contact-panel h2{color:#fff}
.contact-panel p{max-width:720px;margin:0 auto 20px;color:#e8eee9}
.contact-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.contact-note{font-size:.88rem;color:#dbe6df!important;margin-top:16px!important}
.devotional-section{background:#f1f4f0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.devotional-section .wrap{padding-top:42px;padding-bottom:48px}
.devotional-head{text-align:center;margin:0 auto 22px;max-width:780px}
.devotional-head p{margin:0;color:var(--muted)}
.devotional-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:18px}
.pdf-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pdf-button{border:1px solid #cbd5cf;border-radius:999px;padding:7px 13px;background:#fff;color:var(--green);font:inherit;font-weight:700;cursor:pointer}.pdf-button:hover,.pdf-button:focus{background:var(--soft)}
.search{width:100%;padding:11px 14px;border:1px solid #cbd5cf;border-radius:10px;background:#fff}
.devotional-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,34px);box-shadow:0 8px 26px #20372d0a}
.devotional-title{font-size:clamp(1.55rem,4vw,2.2rem);color:var(--green);margin:0 0 18px}
.date{font-family:Arial,sans-serif;color:var(--muted);font-size:.9rem;margin:0 0 6px}
.devotional-card h3{font-size:1.08rem;margin:24px 0 7px}
.verse{padding:15px 18px;background:#f5f3eb;border-left:4px solid var(--gold);border-radius:0 10px 10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.scripture-reference{margin:0 0 8px;font-weight:700;color:var(--green);font-size:.96rem}.application-list{margin:0;padding-left:1.4rem;line-height:1.8}.application-list li{padding-left:.25rem;margin:.35rem 0}.body-copy{white-space:pre-line}
.body-copy{white-space:pre-wrap;overflow-wrap:anywhere}
.truth,.decision{padding:12px 15px;border-radius:10px;background:var(--soft)}
.archive{margin-top:26px}
details.year{border:1px solid var(--line);border-radius:12px;background:#fff;margin:9px 0;overflow:hidden}
details.year>summary{cursor:pointer;padding:12px 16px;background:#f1f4f0;color:var(--green);font-weight:bold}
.month{padding:8px 14px 12px}.month h4{font-size:1rem;margin:8px 0;color:var(--muted)}
.entry{display:block;text-align:left;width:100%;padding:9px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:var(--green);line-height:1.5}
.entry:hover,.entry:focus{background:#f1f4f0}.entry small{display:block;color:var(--muted);font-family:Arial,sans-serif;font-size:.78rem}
.status{padding:16px;text-align:center;color:var(--muted)}.error{color:#8b2f24;background:#fff1ef;border-radius:10px;padding:12px}
.site-footer{text-align:center;color:#dce6df;background:#102c27;padding:28px 16px;border-top:4px solid var(--gold)}
.site-footer strong{display:block;color:#fff;letter-spacing:.06em;font-family:Arial,sans-serif}
.site-footer p{margin:4px 0}
.footer-copy{font-size:.86rem;color:#b9c9c1;margin-top:12px!important}
.page-panel[hidden]{display:none!important}.page-panel{animation:pageIn .18s ease-out}@keyframes pageIn{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}.home-link{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:left;box-shadow:0 8px 26px #20372d08}.home-link h3{margin:0 0 8px}.home-link p{margin:0;color:#4e5c55}.donate-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:24px 0 18px}.donate-tab{border:1px solid #cbd5cf;border-radius:999px;padding:10px 17px;background:#fff;color:var(--green);font-weight:700}.donate-tab[aria-selected=true]{background:var(--green);color:#fff;border-color:var(--green)}.support-methods{display:grid;grid-template-columns:1fr;gap:16px;max-width:600px;margin:0 auto}.support-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}@media(max-width:760px){.home-grid{grid-template-columns:1fr}}[hidden]{display:none!important}
@media(max-width:760px){.card-grid{grid-template-columns:1fr}.teaching-grid{grid-template-columns:1fr}.teaching-image{height:230px}.topbar{position:static}.nav-links a{padding:7px 9px}.wrap{padding:36px 15px}}
@media(max-width:520px){.site-hero{min-height:320px;padding:48px 16px}.devotional-tools{grid-template-columns:1fr}.nav-links{width:100%}.nav-links a{font-size:.85rem}.topbar{gap:7px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<header class="site-hero" id="home">
  <div class="brand">
  New Thing Makers Ministry
</div>
  <p class="brand-my" data-en="New Thing Makers Ministry" data-my="အသစ်သောအရာများကို ဖန်တီးတော်မူသော ဘုရားသခင်၏ အမှုတော်"></p>
  <p class="hero-line" data-en="God at Work Through Us" data-my="အမှုတော်သစ် ဖော်ဆောင်သူများ"></p>
  <p class="hero-subline" data-en="Making Disciples, Expanding His Kingdom" data-my="တပည့်တော်များကို ပြုစုပျိုးထောင်ခြင်း၊ ကိုယ်တော်၏နိုင်ငံတော်ကို ချဲ့ထွင်ခြင်း"></p>
  <div class="hero-actions"><a class="btn btn-gold" href="#about" data-page="about" data-en="Explore Our Ministry" data-my="ကျွန်ုပ်တို့၏အမှုတော်ကို လေ့လာရန်"></a><a class="btn btn-light" href="#devotional" data-page="devotional" data-en="Read Devotionals" data-my="နေ့စဉ်ဝေငှချက်များ ဖတ်ရန်"></a></div>
</header>

<nav class="topbar" aria-label="Main navigation">
  <div class="nav-links">
    <a href="#home" data-page="home" data-en="Home" data-my="ပင်မ"></a>
    <a href="#about" data-page="about" data-en="About" data-my="အကြောင်း"></a>
    <a href="#devotional" data-page="devotional" data-en="Devotional" data-my="ဝိညာဉ်ရေးရာ"></a>
    <a href="#teaching" data-page="teaching" data-en="Teaching" data-my="သင်ကြားခြင်း"></a>
    <a href="#support" data-page="support" data-en="Donate" data-my="ထောက်ပံ့ရန်"></a>
    <a href="#contact" data-page="contact" data-en="Contact" data-my="ဆက်သွယ်ရန်"></a>
  </div>
  <button class="lang-button" id="englishBtn" aria-pressed="true">English</button>
  <button class="lang-button" id="myanmarBtn" aria-pressed="false">မြန်မာ</button>
</nav>

<main>

<section class="wrap section page-panel" id="home-page">
  <div class="about-intro">
    <p class="eyebrow" data-en="Welcome" data-my="ကြိုဆိုပါသည်"></p>
    <h1 data-en="Welcome to New Thing Makers Ministry" data-my="New Thing Makers Ministry မှ ကြိုဆိုပါသည်"></h1>
    <p class="lead" data-en="Growing in Christ, making disciples, and expanding His Kingdom." data-my="ခရစ်တော်၌ ကြီးထွားခြင်း၊ တပည့်တော်များကို ပြုစုပျိုးထောင်ခြင်းနှင့် ကိုယ်တော်၏နိုင်ငံတော်ကို ချဲ့ထွင်ခြင်း။"></p>
  </div>
  <div class="home-grid">
    <a class="home-link" href="#about" data-page="about"><h3 data-en="About Our Ministry" data-my="ကျွန်ုပ်တို့၏အမှုတော်အကြောင်း"></h3><p data-en="Discover our vision, mission, and values." data-my="ကျွန်ုပ်တို့၏ ရူပါရုံ၊ သာသနာလုပ်ငန်းနှင့် တန်ဖိုးထားမှုများကို လေ့လာပါ။"></p></a>
    <a class="home-link" href="#devotional" data-page="devotional"><h3 data-en="Daily Devotional" data-my="နေ့စဉ်ဝိညာဉ်ရေးရာ ဝေငှချက်"></h3><p data-en="Read and reflect on God's Word." data-my="ဘုရားသခင်၏နှုတ်ကပတ်တော်ကို ဖတ်ရှုပြီး ဆင်ခြင်ပါ။"></p></a>
    <a class="home-link" href="#teaching" data-page="teaching"><h3 data-en="Bible Teaching" data-my="သမ္မာကျမ်းစာ သင်ကြားခြင်း"></h3><p data-en="Explore Bible teaching and discipleship resources." data-my="သမ္မာကျမ်းစာသင်ကြားချက်များနှင့် တပည့်တော်ပြုစုရေး အထောက်အကူများကို လေ့လာပါ။"></p></a>
    <a class="home-link" href="#support" data-page="support"><h3 data-en="Support the Ministry" data-my="သာသနာလုပ်ငန်းကို ထောက်ပံ့ပါ"></h3><p data-en="See the available ways to support our ministry." data-my="သာသနာလုပ်ငန်းကို ပါဝင်ထောက်ပံ့နိုင်မည့် နည်းလမ်းများကို ကြည့်ပါ။"></p></a>
    <a class="home-link" href="#contact" data-page="contact"><h3 data-en="Contact Us" data-my="ဆက်သွယ်ရန်"></h3><p data-en="Get in touch with our ministry." data-my="ကျွန်ုပ်တို့၏အမှုတော်နှင့် ဆက်သွယ်ပါ။"></p></a>
  </div>
</section>

<section class="wrap section page-panel" id="about" hidden>
  <div class="section-heading">
    <p class="eyebrow" data-en="Who we are" data-my="ကျွန်ုပ်တို့၏အကြောင်း"></p>
    <h1 data-en="About Our Ministry" data-my="ကျွန်ုပ်တို့၏အမှုတော်အကြောင်း"></h1>
    <p class="lead" data-en="New Thing Makers Ministry exists to help people grow in Christ, become faithful disciples, and take part in expanding His Kingdom." data-my="New Thing Makers Ministry သည် လူများ ခရစ်တော်၌ ကြီးထွားလာရန်၊ သစ္စာရှိသော တပည့်တော်များ ဖြစ်လာရန်နှင့် ကိုယ်တော်၏နိုင်ငံတော်ကို ချဲ့ထွင်ရာတွင် ပါဝင်ရန် ရည်ရွယ်ပါသည်။"></p>
  </div>
  <div class="card-grid">
        <article class="info-card"><div class="symbol" aria-hidden="true">🌄</div><h3 data-en="Vision" data-my="ရူပါရုံ"></h3><p data-en="To see lives transformed by Christ and communities strengthened through faithful discipleship." data-my="ခရစ်တော်အားဖြင့် အသက်တာများ ပြောင်းလဲပြီး သစ္စာရှိသော တပည့်တော်ပြုစုခြင်းအားဖြင့် လူမှုအသိုင်းအဝိုင်းများ ခိုင်မာလာသည်ကို မြင်တွေ့ရန်။"></p></article>
    <article class="info-card"><div class="symbol" aria-hidden="true">📖</div><h3 data-en="Mission" data-my="သာသနာလုပ်ငန်း"></h3><p data-en="To teach God's Word, nurture spiritual growth, and equip believers to make disciples." data-my="ဘုရားသခင်၏နှုတ်ကပတ်တော်ကို သင်ကြားရန်၊ ဝိညာဉ်ရေးရာ ကြီးထွားမှုကို ပျိုးထောင်ရန်နှင့် ယုံကြည်သူများကို တပည့်တော်ပြုစုနိုင်ရန် ပြင်ဆင်ပေးရန်။"></p></article>
    <article class="info-card"><div class="symbol" aria-hidden="true">✝️</div><h3 data-en="Christ-centered" data-my="ခရစ်တော်ကို ဗဟိုပြုခြင်း"></h3><p data-en="Christ is at the center of our faith, ministry, and life." data-my="ကျွန်ုပ်တို့၏ ယုံကြည်ခြင်း၊ အမှုတော်နှင့် အသက်တာ၏ ဗဟိုချက်မှာ ခရစ်တော်ဖြစ်သည်။"></p></article>
    <article class="info-card"><div class="symbol" aria-hidden="true">🕊️</div><h3 data-en="Spirit-filled" data-my="ဝိညာဉ်တော်နှင့် ပြည့်ဝခြင်း"></h3><p data-en="We depend on the Holy Spirit for guidance, empowerment, and spiritual growth." data-my="လမ်းညွှန်မှု၊ တန်ခိုးပေးမှုနှင့် ဝိညာဉ်ရေးရာ ကြီးထွားမှုအတွက် သန့်ရှင်းသောဝိညာဉ်တော်ကို အားကိုးသည်။"></p></article>

 return {filename,url,date:normalizeDate(data.date,filename),day:String(data.day||"").trim(),

 verse_en:f("verse_en","verse","en"),verse_my:f("verse_my","verse","my"),scripture_en:f("scripture_en",null,"en")||detectedRef,scripture_my:f("scripture_my",null,"my")||myRef,
 reflection_en:f("reflection_en","reflection","en"),reflection_my:f("reflection_my","reflection","my"),
 truth_en:f("truth_en",null,"en"),truth_my:f("truth_my",null,"my"),
 application_en:f("application_en","application","en"),application_my:f("application_my","application","my"),
 decision_en:f("decision_en",null,"en"),decision_my:f("decision_my",null,"my"),
 prayer_en:f("prayer_en","prayer","en"),prayer_my:f("prayer_my","prayer","my"),rawText};
}
function dateLabel(date){if(!date)return"";const d=new Date(date+"T12:00:00");return language==="my"?`${d.getFullYear()} ${MONTHS.my[d.getMonth()]} ${d.getDate()}`:d.toLocaleDateString("en",{year:"numeric",month:"long",day:"numeric"});}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function localized(d,stem){return language==="my"?(d[stem+"_my"]||d[stem+"_en"]||""):(d[stem+"_en"]||d[stem+"_my"]||"");}
function contentText(content){return Array.isArray(content)?content.join("\n"):String(content||"");}
function applicationItems(content){
  return contentText(content)
    .split(/\r?\n/)
    .map(item=>item.trim())
    .filter(Boolean);
}
  function block(label,content,klass="body-copy"){
 if(!content||(Array.isArray(content)&&!content.length))return "";
 const body=Array.isArray(content)?`<ul class="application-list">${content.map(item=>`<li>${esc(item)}</li>`).join("")}</ul>`:`<div class="${klass}">${esc(contentText(content))}</div>`;
 return `<section><h3>${esc(label)}</h3>${body}</section>`;
}
function hashFile(){const m=location.hash.match(/(?:^#|&)devotional=([^&]+)/);if(!m)return"";try{return decodeURIComponent(m[1]);}catch{return m[1];}}
function show(d,updateHash=true){
 if(!d)return;
 const title=localized(d,"title")||(language==="my"?"နေ့စဉ်ဝိညာဉ်ရေးရာ ဝေငှချက်":"Daily Devotional");
 let verse=localized(d,"verse");
 const scripture = localized(d, "scripture") || localized(d, "verse");
 if(language==="my"&&!d.verse_my&&/^\s*(Luke 5:5|လုကာ ၅:၅)\s*$/i.test(String(d.scripture_en||d.scripture_my||""))){
  verse="ရှိမုန်ကလည်း၊ “သခင်၊ အကျွန်ုပ်တို့သည် တစ်ညလုံး ပင်ပန်းစွာ လုပ်ဆောင်သော်လည်း ဘာမျှမရပါ။ သို့သော် ကိုယ်တော်မိန့်တော်မူသောကြောင့် ပိုက်ကွန်ကို ချပါမည်” ဟု ပြန်လျှောက်လေ၏။";
 }
 const reference=verse?`<p class="scripture-reference">${esc(verse)}</p>`:"";
 const verseBlock=scripture?`<section><h3>${esc(TEXT[language].verse)}</h3><div class="verse">${esc(contentText(scripture))}</div></section>`:"";
 $("devotionalCard").innerHTML=`<p class="date">${esc(dateLabel(d.date))}${d.day?" · "+esc(language==="my"?"နေ့ "+d.day:"Day "+d.day):""}</p><h2 class="devotional-title">${esc(title)}</h2>${verseBlock}${block(TEXT[language].reflection,localized(d,"reflection"))}${block(TEXT[language].truth,localized(d,"truth"),"truth")}${block(TEXT[language].application,applicationItems(localized(d,"application")),"application-list")}${block(TEXT[language].decision,localized(d,"decision"),"decision")}${block(TEXT[language].prayer,localized(d,"prayer"))}`;
 $("devotionalCard").hidden=false;$("status").hidden=true;if(updateHash&&d.filename)history.replaceState(null,"",`#devotional=${encodeURIComponent(d.filename)}`);
}

function pdfEscape(value){return esc(contentText(value)).replace(/\n/g,"<br>");}
function exportDevotionalPDF(size,lang){
 const d=devotionals.find(item=>item.filename===hashFile())||devotionals[0];
 if(!d){alert(lang==="my"?"ဝေငှချက် မတွေ့ပါ။":"No devotional is available to export.");return;}
 const isMy=lang==="my";
 const pick=(en,my)=>contentText(isMy?(my||""):(en||"")).trim();
 const title=pick(d.title_en,d.title_my)||(isMy?"နေ့စဉ်ဝိညာဉ်ရေးရာ ဝေငှချက်":"Daily Devotional");
 const verse=pick(d.verse_en,d.verse_my);
 const scripture=pick(d.scripture_en,d.scripture_my);
 const reflection=pick(d.reflection_en,d.reflection_my);
 const truth=pick(d.truth_en,d.truth_my);
 const application=applicationItems(pick(d.application_en,d.application_my));
 const decision=pick(d.decision_en,d.decision_my);
 const prayer=pick(d.prayer_en,d.prayer_my);
 const labels=isMy?{
   verse:"ကျမ်းချက်",scripture:"ကျမ်းညွှန်း",reflection:"ဆင်ခြင်အောက်မေ့ရန်",
   truth:"မှတ်သားရမည့် သမ္မာတရား",application:"လက်တွေ့အသုံးချရန်",
   decision:"ကျွန်ုပ်၏ဆုံးဖြတ်ချက်",prayer:"ဆုတောင်းခြင်း"
 }:{
   verse:"Bible Verse",scripture:"Scripture Reference",reflection:"Reflection",
   truth:"Truth to Remember",application:"Application",decision:"My Decision",prayer:"Prayer"
 };
 const section=(label,value,kind="body-copy")=>value?`<section><h3>${esc(label)}</h3><div class="${kind}">${pdfEscape(value)}</div></section>`:"";
 const list=application.length?`<ul>${application.map(item=>`<li>${pdfEscape(item)}</li>`).join("")}</ul>`:"";
 const content=`
 <header><p class="date">${esc(d.date||"")}${d.day?" · "+(isMy?"နေ့ ":"Day ")+esc(d.day):""}</p><h1>${esc(title)}</h1></header>
 ${section(labels.verse,verse,"verse")}
 ${section(labels.scripture,scripture)}
 ${section(labels.reflection,reflection)}
 ${section(labels.truth,truth,"truth")}
 ${application.length?`<section><h3>${esc(labels.application)}</h3>${list}</section>`:""}
 ${section(labels.decision,decision,"decision")}
 ${section(labels.prayer,prayer)}
 <footer>${isMy?"အမှုတော်သစ် ဖော်ဆောင်သူများ":"New Thing Makers Ministry"}${isMy?"":" · Growing in Christ · Making Disciples · Expanding His Kingdom"}</footer>`;
 const win=window.open("","_blank");
 if(!win){alert(isMy?"PDF ထုတ်ရန် Pop-up ကို ခွင့်ပြုပေးပါ။":"Please allow pop-ups to create the PDF.");return;}
 win.document.open();
 win.document.write(`<!doctype html><html lang="${isMy?"my":"en"}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)} - ${size} PDF</title><style>
 @page{size:${size};margin:${size==="A4"?"9mm":"7mm"}}
 *{box-sizing:border-box}
 body{font-family:${isMy?'"Noto Sans Myanmar","Myanmar Text",sans-serif':'Georgia,serif'};color:#1f2937;line-height:1.32;font-size:${size==="A4"?"9":"7.5"}pt;margin:0}
 h1{font-size:1.65em;line-height:1.2;color:#12345a;margin:0 0 .45em}
 h3{font-size:1.12em;line-height:1.2;color:#1d4e89;margin:.75em 0 .3em;border-bottom:1px solid #e5e7eb;padding-bottom:2px}
 p{margin:.2em 0}.date{font: .85em Arial,sans-serif;color:#667085}
 section{break-inside:avoid;margin-bottom:.55em}
 .verse{background:#f5f3eb;padding:.5em;border-left:3px solid #d7b66d;white-space:pre-wrap}
 .truth,.decision{background:#eff4f8;padding:.5em;border-radius:5px;white-space:pre-wrap}
 .body-copy{white-space:pre-wrap;overflow-wrap:anywhere}
 ul{padding-left:1.4em;margin:.25em 0}li{margin:.12em 0;overflow-wrap:anywhere}
 footer{border-top:1px solid #ddd;margin-top:.7em;padding-top:.3em;font-size:.75em;color:#667085;text-align:center}
 </style></head><body>${content}<script>
 window.addEventListener('load',()=>{
   const isA4=${size==="A4"?"true":"false"};
   const usableHeight=isA4?1000:740;
   const minFont=isA4?6.8:5.8;
   let font=parseFloat(getComputedStyle(document.body).fontSize)*72/96;
   const fit=()=>{
     let tries=0;
     while(document.body.scrollHeight>usableHeight && font>minFont && tries<30){
       font-=0.25;document.body.style.fontSize=font+'pt';tries++;
     }
     setTimeout(()=>window.print(),250);
   };
   setTimeout(fit,100);
 });
 <\/script></body></html>`);
 win.document.close();
}
function matches(d,q){return !q||[d.title_en,d.title_my,d.verse_en,d.verse_my,d.scripture_en,d.scripture_my,d.reflection_en,d.reflection_my,d.truth_en,d.truth_my,d.application_en,d.application_my,d.decision_en,d.decision_my,d.prayer_en,d.prayer_my,d.filename,d.rawText].join(" ").toLowerCase().includes(q.toLowerCase());}
function renderArchive(){
 const filtered=devotionals.filter(d=>matches(d,$("searchInput").value.trim()));
 if(!filtered.length){$("archiveList").innerHTML=`<p class="status">${esc(TEXT[language].empty)}</p>`;return;}
 const groups=new Map();filtered.forEach(d=>{const y=d.date?d.date.slice(0,4):(language==="my"?"အခြား":"Other"),mi=d.date?Number(d.date.slice(5,7))-1:-1,m=mi>=0?MONTHS[language][mi]:(language==="my"?"ရက်စွဲမသိ":"Undated");if(!groups.has(y))groups.set(y,new Map());if(!groups.get(y).has(m))groups.get(y).set(m,[]);groups.get(y).get(m).push(d);});
 $("archiveList").innerHTML=[...groups.entries()].map(([y,months],i)=>`<details class="year" ${i===0?"open":""}><summary>${esc(y)}</summary>${[...months.entries()].map(([m,items])=>`<div class="month"><h4>${esc(m)}</h4>${items.map(d=>`<button class="entry" data-file="${esc(d.filename)}">${esc(localized(d,"title")||d.filename)}<small>${esc(dateLabel(d.date))}</small></button>`).join("")}</div>`).join("")}</details>`).join("");
 $("archiveList").querySelectorAll("[data-file]").forEach(b=>b.addEventListener("click",()=>{show(devotionals.find(d=>d.filename===b.dataset.file));$("devotional").scrollIntoView({behavior:"smooth",block:"start"});}));
}
function applyLanguage(){
 document.documentElement.lang=language==="my"?"my":"en";
 document.querySelectorAll("[data-en][data-my]").forEach(el=>{el.textContent=el.dataset[language]||"";});
 $("searchInput").placeholder=TEXT[language].search;$("searchInput").setAttribute("aria-label",TEXT[language].search);
 $("englishBtn").setAttribute("aria-pressed",String(language==="en"));$("myanmarBtn").setAttribute("aria-pressed",String(language==="my"));
 const active=devotionals.find(d=>d.filename===hashFile())||devotionals[0];if(active)show(active,false);
 if(!$("status").hidden&&devotionals.length===0)$("status").textContent=TEXT[language].loading;
 renderArchive();
}
async function load(){
 try{
  const r=await fetch(API,{headers:{"Accept":"application/vnd.github+json"}});if(!r.ok)throw Error("GitHub API "+r.status);
  const files=await r.json(),md=files.filter(f=>f.type==="file"&&f.name.toLowerCase().endsWith(".md"));
  const results=await Promise.all(md.map(async file=>{try{const r=await fetch(file.download_url);if(!r.ok)return null;const text=await r.text();return normalize(parseFrontMatter(text),file.name,file.download_url,text);}catch{return null;}}));
  const nowMY = getMalaysiaDateTime();
  const today = nowMY.date;
  const publishReady = nowMY.hour >= 6;

  devotionals = results
    .filter(d => d && d.date &&
      (d.date < today || (d.date === today && publishReady)))
    .sort((a, b) =>
      b.date.localeCompare(a.date) ||
      a.filename.localeCompare(b.filename)
    );
  $("status").hidden=true;
  if(!devotionals.length){$("status").hidden=false;$("status").textContent=TEXT[language].empty;return;}
  show(devotionals.find(d=>d.filename===hashFile())||devotionals[0],false);renderArchive();
 }catch(e){console.error(e);$("status").hidden=false;$("status").innerHTML=`<p class="error">${esc(TEXT[language].failed)}</p>`;}
}

const pageIds = ["home","about","devotional","teaching","support","contact"];
function showPage(page, scroll=true) {
  const chosen = pageIds.includes(page) ? page : "home";
  document.querySelectorAll(".page-panel").forEach(panel => {
    panel.hidden = panel.id !== (chosen === "home" ? "home-page" : chosen);
  });
  if (scroll) window.scrollTo({top: 0, behavior: "smooth"});
}
document.querySelectorAll("[data-page]").forEach(link => {
  link.addEventListener("click", event => {
    event.preventDefault();
    showPage(link.dataset.page);
  });
});
document.querySelectorAll(".donate-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".donate-tab").forEach(item => item.setAttribute("aria-selected", String(item === tab)));
    document.querySelectorAll('[role="tabpanel"]').forEach(panel => panel.hidden = panel.id !== tab.getAttribute("aria-controls"));
  });
});

$("englishBtn").addEventListener("click",()=>{language="en";applyLanguage();});
$("myanmarBtn").addEventListener("click",()=>{language="my";applyLanguage();});
$("latestBtn").addEventListener("click",()=>{if(devotionals[0]){show(devotionals[0]);$("devotional").scrollIntoView({behavior:"smooth",block:"start"});}});
$("pdfA4EnBtn").addEventListener("click",()=>exportDevotionalPDF("A4","en"));
$("pdfA5EnBtn").addEventListener("click",()=>exportDevotionalPDF("A5","en"));
$("pdfA4MyBtn").addEventListener("click",()=>exportDevotionalPDF("A4","my"));
$("pdfA5MyBtn").addEventListener("click",()=>exportDevotionalPDF("A5","my"));
$("archiveToggle").addEventListener("click",()=>{$("archive").hidden=!$("archive").hidden;if(!$("archive").hidden)$("archive").scrollIntoView({behavior:"smooth",block:"start"});});
$("searchInput").addEventListener("input",()=>{$("archive").hidden=false;renderArchive();});
window.addEventListener("hashchange",()=>{const d=devotionals.find(x=>x.filename===hashFile());if(d)show(d,false);});
// Refresh once Malaysia-local 06:00 has passed, even if this page was
// left open overnight. This is display scheduling, not a server-side publish.
 let lastScheduledRefresh="";
 setInterval(()=>{
  const nowMY=getMalaysiaDateTime();
  if(nowMY.hour>=6 && lastScheduledRefresh!==nowMY.date){
   lastScheduledRefresh=nowMY.date;
   load();
  }
 },30000);
 $("year").textContent=new Date().getFullYear();
showPage("home", false);applyLanguage();load();
})();
</script>
